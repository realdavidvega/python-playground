[project]
name = "langgraph-playground"
version = "0.1.0"
description = "Playground of LangGraph"
requires-python = ">=3.13"
dependencies = [
    "alpha-vantage>=3.0.0",
    "fredapi>=0.5.2",
    "langchain-community>=0.3.25",
    "langchain-tavily>=0.2.1",
    "langchain[anthropic,google-genai]>=0.3.25",
    "langgraph>=0.4.8",
    "langgraph-supervisor>=0.0.27",
    "langgraph-swarm>=0.0.11",
    "pandas>=2.3.0",
    "tiktoken>=0.9.0", # needs ta-lib C library installed on your system
    "ta-lib>=0.6.4",
    "langchain-mcp-adapters>=0.1.7",
    "mcp-server-time>=0.6.2",
    "fastmcp>=2.8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
    "ty>=0.0.1a8",
]

[tool.uv]
package = true

[tool.ruff]
exclude = [".venv", "__pycache__"]

[tool.ty.src]
root = "./src"

