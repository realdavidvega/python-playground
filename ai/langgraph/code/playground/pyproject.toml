[project]
name = "langgraph-playground"
version = "0.1.0"
description = "Playground of LangGraph"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.0",
    "pydantic>=2.11.5",
    "langchain-community>=0.3.27",
    "langchain-tavily>=0.2.6",
    "langchain[anthropic,google-genai]>=0.3.26",
    "langchain-mcp-adapters>=0.1.8",
    "langgraph>=0.5.1",
    "langgraph-supervisor>=0.0.27",
    "langgraph-swarm>=0.0.11",
    "mcp-server-time>=2025.7.1",
    "alpha-vantage>=3.0.0",
    "fredapi>=0.5.2",
    "tiktoken>=0.9.0",
    "ta-lib>=0.6.4",                             # needs ta-lib C library installed on your system
    "fastmcp>=2.10.4",
    "bs4>=0.0.2",
    "pdf2image>=1.17.0",                         # needs poppler installed on your system
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = ["ruff>=0.12.2", "uv-build>=0.7.19", "pyrefly>=0.23.0"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/.[!/.]*", "**/*venv/**"]
search-path = ["src"]

